###############################################################################
#                            CONFIGURATION                                    #
###############################################################################
[global_tags]
  user = "tu_usuario_de_monitorizacion_aqui"

[agent]
  interval = "60s"            # Los IP SLAs no suelen cambiar cada 10s, 60s es más eficiente
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "hostname_del_equipo_de_monitoreo"
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "tu_token_secreto_con_permiso_a_todo_aqui"
  organization = "tu_organizacion_aqui"
  bucket = "rpm"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "tu_token_secreto_con_permiso_a_todo_aqui"
  organization = "tu_organizacion_aqui"
  bucket = "ub"
  [outputs.influxdb_v2.tagpass]
    cliente = ["ub"] # Solo envía datos si tienen este tag

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "tu_token_secreto_con_permiso_a_todo_aqui"
  organization = "tu_organizacion_aqui"
  bucket = "uab"
  [outputs.influxdb_v2.tagpass]
    cliente = ["uab"] # Solo envía datos si tienen este tag

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "tu_token_secreto_con_permiso_a_todo_aqui"
  organization = "tu_organizacion_aqui"
  bucket = "udg"
  [outputs.influxdb_v2.tagpass]
    cliente = ["udg"] # Solo envía datos si tienen este tag

