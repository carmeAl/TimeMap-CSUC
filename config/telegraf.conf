###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# --- MEDICIÓN DE LATENCIA MEDIANTE SCRIPT CISCO (ADAPTADO) ---
[[inputs.exec]]
  ## Ruta al script adaptado para Cisco
  commands = [
   "python3 /opt/twamp_probe_snmpwalk_cisco_v9.py 10.0.0.10 CSUC",
   "python3 /opt/twamp_probe_snmpwalk_cisco_v9.py 10.0.1.1 CSUC",
  ]

  ## Tiempo de espera (SNMP Walk puede tardar unos segundos)
  timeout = "40s"

  ## Forzamos el nombre de la medición para que coincida con el Dashboard
  name_override = "exec_rpm"

  ## Formato de los datos
  data_format = "json"

  ## Definimos qué campos del JSON son etiquetas para filtrar en Grafana
  tag_keys = [
    "src",
    "dst",
    "cliente",
    "measurement",
    "src_ip",
    "dst_ip",
    "src_short",      
    "dst_short",   
    "flavor"
  ]

[[inputs.exec]]
  commands = ["python3 /opt/twping_json.py 10.0.0.13 10.0.0.10"]
  timeout = "20s"
  interval = "1m"
  
  # Esto le dice a Telegraf que el JSON contiene los datos
  data_format = "json"
  
  # Este es el campo que preguntabas:
  name_override = "exec_twamp"
  
  # IMPORTANTE: Indica qué campos del JSON son etiquetas (Tags) 
  # para que Grafana pueda filtrar por ellos eficientemente
  tag_keys = [
    "src_ip",
    "dst_ip",
    "src_short",
    "dst_short"
  ]

