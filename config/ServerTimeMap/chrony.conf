[sudo] password for calcala: 
# 1. FUENTES DE TIEMPO (Vacío porque estás aislado)
# No ponemos 'pool' ni 'server' externos. 

# 2. EL SERVIDOR COMO MAESTRO (Imprescindible para redes aisladas)
# Esto le dice a Chrony que confíe en su propio reloj interno.
# Ponemos stratum 5 para que el router lo vea como una fuente muy estable.
local stratum 5

# 3. PERMISOS
# Permite que Lapica (10.0.0.10) y otros equipos de la red consulten la hora.
allow 10.0.0.0/24

# 4. ARCHIVOS DE ESTADO
# Guarda la desviación del cristal de cuarzo para ganar precisión con el tiempo.
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony

# 5. AJUSTES DE PRECISIÓN
# Sincroniza el reloj del sistema con el RTC (reloj de hardware) del PC.
rtcsync

# Permite saltos bruscos de tiempo si el desfase es mayor a 0.1s en los 
# primeros 10 ciclos (ideal para arranques rápidos en laboratorio).
makestep 0.1 10

# 6. LOGS (Útil para depurar si TWAMP falla)
logdir /var/log/chrony
# Descomenta la siguiente línea si quieres ver quién pide la hora:
# log measurements statistics tracking
